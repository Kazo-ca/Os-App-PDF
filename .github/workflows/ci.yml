# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles. Only the
# Kazo OS submodule is fetched: the app uses the PdfCraft build committed in wwwroot/pdfcraft/, and
# PdfCraft's sources are only needed to compile it (build-pdfcraft.yml).
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7).
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
